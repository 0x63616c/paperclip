[package]
name = "xtask"
description = "Dev-workflow recipes with real logic: the device bundle, ADR scaffolding, and the release planner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
clap = { workspace = true }
# Completions and a man page for `paperctl`, generated straight from its own
# `clap` derive (WWW-48) rather than a second, hand-maintained copy of its
# command line.
clap_complete = "4.6"
clap_mangen = "0.3"
# For `REQUIRED_COMPONENTS`: which apps ship inside the platform bundle rather
# than through the catalog. Reading it from the crate that enforces it is what
# keeps the planner from drifting out of step with the manifest it plans for.
paper-updater = { workspace = true }
paperctl = { path = "../tools/paperctl" }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# build.rs shares xtask/src/install_hooks.rs (WWW-66) via `#[path]`, which
# needs the same derive macro available to the build script's own
# compilation.
[build-dependencies]
thiserror = { workspace = true }

[lints]
workspace = true
