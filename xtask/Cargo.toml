[package]
name = "xtask"
description = "Dev-workflow recipes with real logic: the device bundle, ADR scaffolding, and the release planner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
clap = { workspace = true }
# For `REQUIRED_COMPONENTS`: which apps ship inside the platform bundle rather
# than through the catalog. Reading it from the crate that enforces it is what
# keeps the planner from drifting out of step with the manifest it plans for.
paper-updater = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
