# The compositor core (§WWW-52, WWW-77): shared-memory client pools, the
# pending/current buffer lifecycle, and the validation that keeps a
# malformed message from ever reaching a memory access. Also the system
# chrome layer (WWW-79) the compositor draws outside any client's surface.
#
# Deliberately not a `[[bin]]` yet. The socket accept loop that turns this
# into a running process — non-blocking client I/O, EOF teardown on a crash —
# is WWW-78's job, staged behind this one so a wedged-client mechanism is not
# designed before the state it has to protect exists. This crate is the state
# `platform/compositor`'s eventual event loop will drive.
[package]
name = "paper-compositor"
description = "The Paperclip compositor core: shared-memory pools, buffer lifecycle, atomic surface commit and system chrome."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
paper-protocol = { workspace = true }
paper-sdk = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
