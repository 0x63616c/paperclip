[package]
name = "paper-packages-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Kept out of the root workspace deliberately: cargo-fuzz needs nightly and
# sanitizer flags the rest of the workspace never builds with (rust-toolchain.toml
# pins stable), and libfuzzer-sys pulls its own dependency graph.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3.24"

[dependencies.paper-packages]
path = ".."
default-features = false

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false
