[package]
name = "paper-device"
description = "The reMarkable Paper Pro adapter: vendor waveform presentation, evdev input, and the session locks a takeover must hold."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Nothing by default. A Mac build of this crate compiles the portable half —
# geometry, waveform selection, evdev decoding, transforms — and links nothing.
default = []

# Link the vendor waveform engine through `native/`. Requires an aarch64 Linux
# target, the reMarkable SDK sysroot (Qt 6.10.3), and `libqsgepaper.so` copied
# off the device. The library is proprietary (`LICENSE: CLOSED`) and is never
# vendored into this repository; see `native/README.md` and ADR-0009.
vendor-engine = ["dep:cc"]

[dependencies]
paper-sdk = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The takeover example draws a real screen rather than a test pattern: §9 wants
# the same UI code on both backends, and a rectangle would not prove that.
paper-home = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[build-dependencies]
cc = { workspace = true, optional = true }

# Device-only: it links the vendor engine and calls systemd, so a Mac build of
# the workspace must not try to compile it. `vendor-engine` already refuses any
# target that is not aarch64 Linux, so this one gate covers both.
[[example]]
name = "takeover"
required-features = ["vendor-engine"]

[lints]
workspace = true
