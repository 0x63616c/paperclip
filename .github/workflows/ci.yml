name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    # `--keep-going` here and in `doc`: cargo stops at the first crate that
    # fails, so one run reports one crate and each fix unmasks the next. That
    # cost four round-trips in one evening (WWW-59, WWW-65, WWW-61).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings

  clippy-device:
    # The same lints against the device target. `paperctl`'s Mac half is
    # `#[cfg(not(target_os = "linux"))]`, so code that is live on a Mac can be
    # dead on the tablet, and vice versa. `device-check` runs `cargo check`,
    # not `clippy`, which is the hole WWW-65's six dead-code findings fell
    # through.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --keep-going --target aarch64-unknown-linux-gnu -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  doc:
    # `--target aarch64-unknown-linux-gnu`: an intra-doc link to a
    # `#[cfg(target_os = "linux")]` item cannot resolve on a triple whose
    # `target_os` isn't linux (WWW-67), so this documents the device rather
    # than relying on the runner's own OS to happen to match.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --keep-going --target aarch64-unknown-linux-gnu
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links

  device-check:
    # Does the device half compile? Needs nothing but rustup — the target is
    # pinned in rust-toolchain.toml (docs/development.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target aarch64-unknown-linux-gnu

  paperctl-device-build:
    # What ships to /home/root/paperclip/bin: no windowing stack, because the
    # tablet has none (docs/development.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p paperctl --no-default-features

  feature-matrix:
    # Every paperctl / paper-packages / paper-updater feature combination
    # compiles, short of `vendor-engine` — that needs the proprietary vendor
    # SDK (platform/device/native/README.md) and is never available in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: |
          cargo hack check -p paperctl -p paper-packages -p paper-updater \
            --feature-powerset --exclude-features vendor-engine

  signing-boundary:
    # §12: the device build must not contain a code path that can sign a
    # release. `--no-default-features` turns the `publishing` feature off at
    # compile time (Cargo.toml); this asserts the built binary actually
    # carries no signing symbol, so a feature-gating mistake fails here
    # instead of shipping to the tablet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p paperctl --no-default-features --release
      - run: ./tools/assert-no-signing-path.sh target/release/paperctl
