# Publishing, driven by a version bump rather than by a push (WWW-62, ADR-0026).
#
# Most pushes publish nothing. `cargo xtask plan-release` compares what the tree
# *declares* — `apps/<app>/paper.toml` for the catalog apps, `release.toml` for
# the platform — against what is already published, and only what is declared
# and missing gets built. That comparison is against published state rather than
# against the parent commit on purpose: a force-push, a push of several commits,
# a revert, or a re-run after a red build all break a `git diff HEAD^` trigger,
# and none of them break this one. Running it twice is harmless.
#
# Signing happens in this workflow too, via the `PAPERCLIP_SIGNING_KEY`
# repository secret (ADR-0041, superseding ADR-0030's off-CI-only rule). Each
# publish step is immediately followed by a sign step in the same job, using
# the archive/components already on disk rather than re-downloading them.
# ADR-0013 keeps the signing surface small regardless — a few hundred bytes of
# TOML, detached, never the archives themselves.
#
# Nothing proprietary is needed. `vendor-engine` can only be enabled by
# `platform/device` and `tools/paperctl`; `paper-host` has no `[features]` table
# at all, so every component of a platform release cross-compiles with an
# ordinary GCC. `paperctl` itself is the one artefact that needs the vendor
# library, and it is deliberately not part of a release bundle — it lives
# outside `releases/` as the recovery bootstrap.
name: Release

on:
  # Gated on CI, not on the push: a release built from a red tree is a rollback
  # target nobody wants.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The `.cargo/config.toml` linker is a `zig cc` wrapper, for a Mac that has
  # zig and not a cross GCC. A Linux runner has the real thing from apt, and
  # the vendor C++ ABI wants libstdc++ anyway (tools/cross/build-device.sh).
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      platform: ${{ steps.plan.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: Swatinem/rust-cache@v2
      - id: plan
        # Exits non-zero when a declared version is already published with
        # different content. That is the finding, not a tool failure, and it
        # must stop the run rather than be skipped quietly.
        run: |
          cargo xtask plan-release --format json | tee plan.json
          jq -c '[.apps[] | select(.action == "publish")]' plan.json \
            | sed 's/^/apps=/' >> "$GITHUB_OUTPUT"
          jq -r 'if .platform.action == "publish" then
                   "platform=" + (.platform | @json)
                 else "platform=" end' plan.json >> "$GITHUB_OUTPUT"

  app:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      # One failed app must not cancel the others: they are independent
      # releases that happen to have been planned together.
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Stage the entrypoint
        run: ./tools/package-app.sh "$(basename '${{ matrix.app.source_dir }}')"
      - name: Build the archive
        # `paperctl package` holds no signing key — only `publish` does — so
        # this is the whole of what CI can honestly produce.
        run: |
          cargo run -p paperctl -- package '${{ matrix.app.source_dir }}' \
            --out '${{ matrix.app.name }}-${{ matrix.app.version }}.paperpkg'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The digest line is what makes the next plan idempotent: it records
        # what was declared at publish time, so a re-run reports `up_to_date`
        # rather than publishing again (ADR-0026). It is parsed with
        # `strip_prefix` against the raw line, so it must start at column one —
        # hence a notes file rather than an indented inline string.
        run: |
          printf '%s\n\n%s\n' \
            'paperclip-digest: ${{ matrix.app.expected_digest }}' \
            'Signed by the next step in this same job (ADR-0041).' \
            > notes.md
          gh release create '${{ matrix.app.tag }}' \
            --title '${{ matrix.app.name }} ${{ matrix.app.version }}' \
            --notes-file notes.md \
            '${{ matrix.app.name }}-${{ matrix.app.version }}.paperpkg'
      - name: Sign
        env:
          GH_TOKEN: ${{ github.token }}
        # `sign-release` rebuilds from source and refuses unless the result
        # byte-matches the archive just published — a real independent check,
        # not a formality, since this runner has the same real cross GCC that
        # built it (unlike a Mac, which needs `--trust-ci-build`; ADR-0030).
        # `--archive` points at that already-built file so the Publish step's
        # upload isn't redundantly re-downloaded.
        run: |
          umask 077
          key="$RUNNER_TEMP/paperclip.key"
          catalog="$RUNNER_TEMP/catalog"
          printf '%s' '${{ secrets.PAPERCLIP_SIGNING_KEY }}' > "$key"
          mkdir -p "$catalog"
          cargo run -p paperctl -- sign-release '${{ matrix.app.tag }}' \
            --catalog "$catalog" \
            --key "$key" \
            --archive '${{ matrix.app.name }}-${{ matrix.app.version }}.paperpkg'
          rm -f "$key"

  platform:
    needs: plan
    if: needs.plan.outputs.platform != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build the four components
        # `REQUIRED_COMPONENTS` (platform/updater/src/manifest.rs). The bundle
        # itself is not assembled here: `paperctl upgrade package` signs
        # `platform.toml` *inside* the tar, so there is no unsigned bundle to
        # produce. The binaries are what CI can give the signing machine.
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu \
            -p paper-host --bin paperclip-host \
            -p paper-home --bin home \
            -p paper-app-store --bin app-store \
            -p paper-settings --bin settings
          mkdir -p bundle/bin
          for binary in paperclip-host home app-store settings; do
            cp "target/aarch64-unknown-linux-gnu/release/$binary" "bundle/bin/$binary"
          done
          ( cd bundle && sha256sum bin/* > SHA256SUMS && cat SHA256SUMS )
          tar -czf platform-components.tar.gz -C bundle .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan='${{ needs.plan.outputs.platform }}'
          tag=$(jq -r .tag <<<"$plan")
          version=$(jq -r .version <<<"$plan")
          digest=$(jq -r .expected_digest <<<"$plan")
          printf '%s\n\n%s\n' \
            "paperclip-digest: $digest" \
            'Signed by the next step in this same job (ADR-0041): `paperctl sign-release` assembles and signs the bundle from these components.' \
            > notes.md
          gh release create "$tag" \
            --title "Paperclip $version" \
            --notes-file notes.md \
            platform-components.tar.gz bundle/SHA256SUMS
      - name: Sign
        env:
          GH_TOKEN: ${{ github.token }}
        # The platform half is never rebuilt (WWW-63: four cross-compiled
        # binaries is a full workspace build); `sign-release` instead checks
        # the downloaded components against their own SHA256SUMS and signs
        # what this job built, same as it always has.
        run: |
          umask 077
          key="$RUNNER_TEMP/paperclip.key"
          printf '%s' '${{ secrets.PAPERCLIP_SIGNING_KEY }}' > "$key"
          tag=$(jq -r .tag <<<'${{ needs.plan.outputs.platform }}')
          cargo run -p paperctl -- sign-release "$tag" --key "$key"
          rm -f "$key"
