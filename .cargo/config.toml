# Cross-compiling for the tablet.
#
# `aarch64-unknown-linux-gnu` is the device triple, established by WWW-1:
# glibc (`ld-linux-aarch64.so.1`, `libc.so.6`), Qt 6.10.3, `libstdc++.so.6`.
# WWW-10's A6 verdict said to add it with the first build that exercises it;
# `platform/device` is that build.
#
# The linker is a two-line `zig cc` wrapper rather than the reMarkable SDK, so
# that a check of the device half costs nothing to set up. Anything that links
# Qt — the `vendor-engine` feature — needs the real SDK and overrides this.
# Note for anyone building *natively* on aarch64 Linux — the failure harness's
# VM, or the tablet itself — where this is the host triple rather than a cross
# target: the wrapper is not on PATH there and every link fails with exit 127.
# Override it with the native linker:
#
#     CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=cc cargo build
#
# `tools/vm-harness/run-harness.sh` does this.
[target.aarch64-unknown-linux-gnu]
linker = "tools/cross/aarch64-linux-gnu-cc"

# `ring` (WWW-68, the HTTPS catalog transport's TLS) is the first device-build
# dependency with C sources of its own, so `cc-rs` needs a *compiler* for this
# target, not just the linker above. Without this it falls back to guessing
# `aarch64-linux-gnu-gcc`, which is not installed here (or on CI) — the whole
# point of the `zig cc` wrapper is not needing a real cross toolchain.
[env]
# `relative = true`: a build script's working directory is its own crate's
# manifest directory, not the workspace root, unlike `[target.*].linker`
# above (which cargo resolves relative to this file itself either way).
CC_aarch64_unknown_linux_gnu = { value = "tools/cross/aarch64-linux-gnu-cc", relative = true }

# The recipes with real logic behind `just device-bundle` and `just new-adr`
# (WWW-45): `cargo xtask <recipe>` rather than `cargo run -p xtask --
# <recipe>`, the standard shape for a workspace's own dev-tool crate.
[alias]
xtask = "run --package xtask --"
