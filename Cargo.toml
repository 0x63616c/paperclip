# Virtual workspace root. Crates appear here as their functionality lands; the
# full §7 layout is the destination, not a scaffold to be created empty.
#
# Note: `tests/system` is a real package with an explicitly registered test
# target. A `tests/` directory at a virtual workspace root is NOT picked up as
# a Cargo integration-test target on its own (§7).
[workspace]
resolver = "3"
members = [
    "platform/protocol",
    "platform/packages",
    "platform/sdk",
    "platform/device",
    "platform/host",
    "platform/sys",
    "platform/telemetry",
    "platform/testing",
    "platform/updater",
    "apps/app-store",
    "apps/home",
    "apps/chess",
    "apps/settings",
    "apps/chess-rules",
    "apps/sudoku",
    "apps/sudoku-rules",
    "tools/paperctl",
    "tools/fault-app",
    "tests/system",
    "tests/conformance",
    "tests/failure-harness",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
repository = "https://github.com/0x63616c/paperclip"

[workspace.dependencies]
paper-protocol = { path = "platform/protocol" }
# `default-features = false` here: the default feature is `publishing`, which
# is the half that holds a signing key. A consumer that needs it says so
# (`paperctl`), and the device build cannot pick it up by accident (§12).
paper-packages = { path = "platform/packages", default-features = false }
# `default-features = false` here, `features = ["desktop"]` at the one
# consumer that needs a window. Apps must not drag in a windowing stack.
paper-sdk = { path = "platform/sdk", default-features = false }
paper-device = { path = "platform/device" }
paper-app-store = { path = "apps/app-store" }
paper-home = { path = "apps/home" }
paper-host = { path = "platform/host" }
# `default-features = false` here for the reason `paper-packages` has it: the
# default feature renders the document a signature is made over, and the
# device build must not contain it. `paperctl` turns it on behind its own
# `publishing` feature.
paper-updater = { path = "platform/updater", default-features = false }
paper-chess = { path = "apps/chess" }
paper-settings = { path = "apps/settings" }
paper-chess-rules = { path = "apps/chess-rules" }
paper-sudoku = { path = "apps/sudoku" }
paper-sudoku-rules = { path = "apps/sudoku-rules" }
paper-sys = { path = "platform/sys" }
paper-telemetry = { path = "platform/telemetry" }
# Dev-dependency only, everywhere it appears — see the crate's own doc comment.
paper-testing = { path = "platform/testing" }

cc = "1.2"
chess = "3.2"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "3.0"
flate2 = "1.1"
getrandom = { version = "0.4", features = ["std"] }
libc = "0.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11"
softbuffer = "0.4.8"
tar = "0.4"
tempfile = "3.24"
thiserror = "2.0.20"
tiny-skia = "0.12"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
winit = "0.30.13"

[workspace.lints.rust]
# `deny`, not `forbid`: platform/device/native will eventually need unsafe FFI
# and must be able to opt in locally with a written justification.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Style rules from §7, enforced where the linter can see them.
undocumented_unsafe_blocks = "warn"
exit = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
wildcard_imports = "warn"
needless_pass_by_value = "warn"
str_to_string = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
