[package]
name = "paperctl"
description = "The Paperclip command line: desktop preview, screenshots, manifest validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# `--no-default-features` is the device build, and it is not an optimisation.
# `paperctl stock` is the independent recovery path: it has to compile and run
# on the tablet, and the tablet has no windowing stack at all — no libEGL, no
# Mesa, no GPU (WWW-1 §3). Leaving the preview in the default build is right
# for a developer's Mac; leaving it *mandatory* would mean the one command that
# rescues a stuck device could not be built for it.
[features]
default = ["desktop", "publishing", "discovery"]
# The offscreen renderer and the built-in screens.
apps = [
    "dep:paper-app-store",
    "dep:paper-chess",
    "dep:paper-chess-rules",
    "dep:paper-home",
    "dep:paper-settings",
    "dep:paper-sudoku",
    "dep:paper-sudoku-rules",
]
# The preview window, which drags in winit and softbuffer.
desktop = ["apps", "paper-sdk/desktop"]
# `paperctl key`, `package`, `publish` and `check`: the commands that hold a
# signing key. Off in the device build for the same reason `paper-packages`
# gates its own publishing half — the tablet installs and verifies, and must
# not contain a code path that can sign a release (§12).
publishing = ["paper-packages/publishing", "paper-updater/publishing"]
# Link the vendor waveform engine, so `paperctl open` can reach the glass.
# aarch64 Linux only, and it needs the vendor library off the device; see
# `platform/device/native/README.md`. Without it `open` refuses rather than
# stopping Xochitl to present into memory.
vendor-engine = ["apps", "paper-device/vendor-engine"]
# mDNS auto-discovery for the Mac-side device transport (WWW-33). Off the
# device build on purpose: the tablet never needs to discover itself, and
# `tools/cross/build-device.sh` asks for `--no-default-features
# --features vendor-engine` without this one.
discovery = ["dep:mdns-sd"]

[dependencies]
clap = { workspace = true }
mdns-sd = { version = "0.21", default-features = false, optional = true }
paper-app-store = { workspace = true, optional = true }
paper-chess = { workspace = true, optional = true }
paper-chess-rules = { workspace = true, optional = true }
paper-device = { workspace = true }
paper-home = { workspace = true, optional = true }
paper-host = { workspace = true }
paper-packages = { workspace = true }
paper-protocol = { workspace = true }
paper-sdk = { workspace = true }
paper-settings = { workspace = true, optional = true }
paper-sudoku = { workspace = true, optional = true }
paper-sudoku-rules = { workspace = true, optional = true }
paper-telemetry = { workspace = true }
paper-updater = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
