# Pinned so every build on the Mac — and every later cross build — starts from
# the same compiler. Bump deliberately, in its own commit, with a note in the
# ADR log if the bump is forced by a dependency.
[toolchain]
channel = "1.94.0"
components = ["rustfmt", "clippy"]
# The tablet: aarch64, glibc, `ld-linux-aarch64.so.1` (WWW-1). Added by WWW-3
# with the first build that exercises it, which is what A6 in
# `docs/assumptions.md` said the condition for adding it was. The linker is a
# `zig cc` wrapper; see `.cargo/config.toml` and `docs/development.md`.
targets = ["aarch64-unknown-linux-gnu"]
profile = "minimal"
